<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survival Stick</title>
  <!--
    GitHub Pages shows this file for any address that is not a real file.
    The app uses "#/page" addresses inside index.html, so we simply send the
    visitor back to the home page. The relative link works in a project
    sub-folder such as https://USERNAME.github.io/survival-stick/.
  -->
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      // On *.github.io project sites the first path segment is the repository name.
      var base = /\.github\.io$/.test(location.hostname) && parts.length ? '/' + parts[0] + '/' : '/';
      location.replace(base);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14232D; color: #F3F5F4; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
    a { color: #FF7417; font-weight: 600; }
  </style>
</head>
<body>
  <p>Page not found. <a href="./">Open Survival Stick</a></p>
</body>
</html>
